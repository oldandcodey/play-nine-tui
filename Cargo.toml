[package]
name = "play-nine-tui"
version = "0.1.0"
edition = "2021"
description = "Play Nine scorekeeper TUI — golf-motif hole scores, totals, and history"
license = "MIT"
rust-version = "1.85"

[dependencies]
crossterm = "0.28"
ratatui = "=0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = true
codegen-units = 1

# Transitive pins for rustc 1.85 (box toolchain). Cargo.lock holds exact versions.
# If `cargo update` bumps instability/darling past what 1.85 allows, re-pin:
#   cargo update instability --precise 0.3.9
